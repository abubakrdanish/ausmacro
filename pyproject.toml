[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ausmacro"
version = "0.1.0"
description = "A few headline Australian economic series from the ABS and RBA as tidy pandas DataFrames"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Abubakar Danish" }]
keywords = ["australia", "abs", "rba", "economics", "cpi", "cash rate", "pandas"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "pandas>=2.0",
    "platformdirs>=3.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "pandas-stubs",
    "pip-tools",
    "pytest",
    "types-requests",
]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["live: calls the real ABS and RBA websites; skipped unless pytest is run with --live"]

[tool.mypy]
python_version = "3.10"
strict = true
# pandas-stubs types reset_index() and boolean indexing as returning Any.
warn_return_any = false
